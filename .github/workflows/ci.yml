name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --preset windows-msvc-debug
      - run: cmake --build --preset windows-msvc-debug
      - run: ctest --preset windows-msvc-debug

  linux:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset linux-${{ matrix.compiler }}-debug
      - run: cmake --build --preset linux-${{ matrix.compiler }}-debug
      - run: ctest --preset linux-${{ matrix.compiler }}-debug

  lint:
    name: Lint (clang-format, clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-19 clang-format-19 clang-tidy-19
      - run: cmake --preset linux-clang-debug -DCMAKE_CXX_COMPILER=clang++-19
      - run: scripts/lint.sh build/linux-clang-debug
        env:
          CLANG_FORMAT: clang-format-19
          CLANG_TIDY: clang-tidy-19
